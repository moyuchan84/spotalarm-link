<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpotAlarm 알림 카드</title>
<meta name="description" content="링크를 누르면 SpotAlarm 앱에서 알림 카드를 받을 수 있어요.">
<meta name="robots" content="noindex">
<!-- 카카오톡·문자 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SpotAlarm">
<meta property="og:title" content="SpotAlarm 알림 카드가 도착했어요">
<meta property="og:description" content="눌러서 SpotAlarm 앱에서 받아 주세요. 위치는 내 폰에서만 써요.">
<meta property="og:image" content="https://spotalarm.mindstartium.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#5B4BE1">
<!--
  SpotAlarm(com.mindstartium.spotalarm) 공유 링크 받기 페이지.
  카드 내용은 주소의 # 뒤에만 있어 서버로 전송되지 않는다. 이 페이지도 외부 요청·분석을 하지 않는다.
  코드 형식은 SpotAlarm lib/domain/share_codec.dart (zlib + base64url JSON).
  카카오톡 등 인앱 브라우저는 앱 링크를 자동으로 열지 않으므로 intent:// 버튼으로 앱을 연다.
-->
<style>
  :root {
    --bg: #F6F5FA; --surface: #FFFFFF; --line: #E3E1EC;
    --text: #1B1A24; --sub: #6A6878; --brand: #5B4BE1; --on: #FFFFFF; --alert: #FFC23D;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F0E15; --surface: #18171F; --line: #2D2C37; --text: #F2F1F7; --sub: #A3A1B0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 400px; text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 24px; background: var(--brand);
          display: inline-flex; align-items: center; justify-content: center; }
  h1 { font-size: 22px; margin: 20px 0 6px; line-height: 1.35; word-break: keep-all; }
  .sub { color: var(--sub); font-size: 15px; margin: 0; line-height: 1.5; word-break: keep-all; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
          padding: 18px; margin: 24px 0; text-align: left; }
  .card[hidden] { display: none; }
  .title { font-size: 18px; font-weight: 700; margin: 0 0 6px; word-break: break-all; }
  .meta { color: var(--sub); font-size: 14px; margin: 0; line-height: 1.5; }
  .btn { display: block; width: 100%; height: 54px; line-height: 54px; border-radius: 14px;
         background: var(--brand); color: var(--on); font-size: 17px; font-weight: 600;
         text-decoration: none; margin-top: 8px; }
  .note { color: var(--sub); font-size: 13px; margin: 16px 0 0; line-height: 1.6; word-break: keep-all; }
  .note a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <span class="logo" aria-hidden="true">
    <svg width="56" height="56" viewBox="0 0 24 24">
      <path fill="#FFFFFF" fill-rule="evenodd" d="M12,1.5C7.86,1.5 4.5,4.86 4.5,9C4.5,14.6 12,22.5 12,22.5S19.5,14.6 19.5,9C19.5,4.86 16.14,1.5 12,1.5ZM12,13.875C12.55,13.875 13,13.425 13,12.875H11C11,13.425 11.445,13.875 12,13.875ZM15,10.875V8.375C15,6.84 14.18,5.555 12.75,5.215V4.875C12.75,4.46 12.415,4.125 12,4.125C11.585,4.125 11.25,4.46 11.25,4.875V5.215C9.815,5.555 9,6.835 9,8.375V10.875L8,11.875V12.375H16V11.875Z"/>
      <circle cx="18.4" cy="4.4" r="3.4" fill="#5B4BE1"/>
      <circle cx="18.4" cy="4.4" r="2.5" fill="#FFC23D"/>
    </svg>
  </span>
  <h1 id="headline">SpotAlarm 알림 카드가 도착했어요</h1>
  <p class="sub" id="lead">아래 버튼을 누르면 앱에서 받을 수 있어요.</p>

  <section class="card" id="card" hidden>
    <p class="title" id="cardTitle"></p>
    <p class="meta" id="cardMeta"></p>
  </section>

  <a class="btn" id="open" href="#">SpotAlarm에서 열기</a>
  <p class="note" id="note">
    앱이 없으면 설치 화면으로 이동해요.<br>
    카드 내용과 위치는 이 링크 안에만 있고 어디에도 저장되지 않아요.
  </p>
</main>
<script>
(function () {
  var PKG = 'com.mindstartium.spotalarm';
  var code = decodeURIComponent(location.hash.replace(/^#/, ''));
  var open = document.getElementById('open');
  var isAndroid = /Android/i.test(navigator.userAgent);

  if (!code) {
    document.getElementById('headline').textContent = '링크가 잘린 것 같아요';
    document.getElementById('lead').textContent = '보낸 분께 링크를 다시 보내 달라고 해 주세요.';
    open.hidden = true;
    document.getElementById('note').hidden = true;
    return;
  }

  // intent:// 는 카카오톡 같은 인앱 브라우저에서도 앱을 열고, 앱이 없으면 Play 스토어로 보낸다.
  open.href = isAndroid
    ? 'intent://c?d=' + encodeURIComponent(code) + '#Intent;scheme=spotalarm;package=' + PKG + ';end'
    : 'spotalarm://c?d=' + encodeURIComponent(code);
  if (!isAndroid) {
    document.getElementById('note').textContent = 'SpotAlarm은 지금 Android 앱만 있어요. Android 폰에서 링크를 열어 주세요.';
  }

  // 미리보기: 코드를 이 기기 안에서만 풀어서 보여준다. 실패해도 버튼은 그대로 쓴다.
  if (!('DecompressionStream' in window)) return;
  try {
    var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    new Response(stream).text().then(function (txt) {
      var c = JSON.parse(txt);
      if (c.s) document.getElementById('headline').textContent = c.s + '님이 알림을 보냈어요';
      document.getElementById('cardTitle').textContent = c.t || '';
      var place = c.l || '그곳';
      var when = c.g === 'l' ? place + '을(를) 떠날 때' : place + '에 도착하면';
      var count = (c.it && c.it.length) ? ' · 챙길 것 ' + c.it.length + '개' : '';
      document.getElementById('cardMeta').textContent = when + ' 울려요' + count;
      document.getElementById('card').hidden = false;
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
